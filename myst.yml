# Jupyter Book 2 configuration
# Reference: https://mystmd.org/guide/frontmatter
version: 1

project:
  id: psy111-multivariate-statistics
  description: >-
    Course materials for the psy111 seminar of the Neurocognitive Psychology
    Master's programme at Carl von Ossietzky Universität Oldenburg.
  copyright: "2025"
  authors:
    - name: Micha Burkhardt
      affiliation: Carl von Ossietzky Universität Oldenburg
  github: https://github.com/mibur1/psy111

  # Enables the "launch in Jupyter" menu on notebook pages
  jupyter: true

  bibliography:
    - book/misc/references.bib

  # Files that are not part of the book
  exclude:
    - example_script.py
    - book/misc/templates.md
    - README.md
    - CHANGELOG.md

  # Hover definitions for recurring acronyms
  abbreviations:
    GLM: General Linear Model
    OLS: Ordinary Least Squares
    EFA: Exploratory Factor Analysis
    CFA: Confirmatory Factor Analysis
    SEM: Structural Equation Modelling
    ML: Maximum Likelihood
    ICC: Intraclass Correlation Coefficient
    AIC: Akaike Information Criterion
    BIC: Bayesian Information Criterion
    RMSEA: Root Mean Square Error of Approximation
    CFI: Comparative Fit Index
    TLI: Tucker-Lewis Index
    SRMR: Standardised Root Mean Square Residual
    VIF: Variance Inflation Factor
    IDE: Integrated Development Environment

  toc:
    - file: book/misc/overview.md

    - title: Introduction to Python
      children:
        - file: book/introduction/1_Setup/0_Introduction.md
          children:
            - file: book/introduction/1_Setup/1_Installation.md
            - file: book/introduction/1_Setup/2_Usage.md
            - file: book/introduction/1_Setup/3_Exercises.ipynb
        - file: book/introduction/2_Data_structures/0_Introduction.md
          children:
