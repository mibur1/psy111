name: deploy-book

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Jupyter Book 2 reads BASE_URL when building the static site
  BASE_URL: /${{ github.event.repository.name }}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The site template is fetched and bundled with npm, so Node must be
      # available. Do not delete /usr/local/lib/node_modules here.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      # ISLP hard-depends on torch, and the default wheel drags in ~4.6 GB of
      # CUDA packages that this book never uses. Installing the CPU-only build
      # first (~190 MB, no nvidia/triton deps) satisfies that requirement, so the
      # resolver below leaves torch alone.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # MyST caches executed cell outputs in _build/execute, keyed by a hash of
      # each page's content. Restoring it means only the pages you actually
      # changed get re-executed; everything else is reused. Locally this takes a
      # full build of psy300 from ~1 min down to ~3 s.
      - name: Restore notebook execution cache
        uses: actions/cache@v4
        with:
          path: _build/execute
          key: myst-execute-${{ runner.os }}-${{ hashFiles('book/**/*.md', 'book/**/*.ipynb', 'requirements.txt') }}
          restore-keys: |
            myst-execute-${{ runner.os }}-

      - name: Build the book
        run: |
          jupyter book build --html --execute

      # GitHub Pages hides every path beginning with an underscore unless this
      # file is present.
      - name: Disable Jekyll processing
        run: touch _build/html/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
